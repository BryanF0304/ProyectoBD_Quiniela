<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela UNA — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --green-50:  #f0fdf4; --green-100: #dcfce7; --green-200: #bbf7d0;
  --green-500: #22c55e; --green-600: #16a34a; --green-700: #15803d;
  --green-800: #166534; --green-900: #14532d;
  --navy-800:  #162d4a; --navy-900:  #0f1f33;
  --gray-50:   #f9fafb; --gray-100:  #f3f4f6; --gray-200:  #e5e7eb;
  --gray-300:  #d1d5db; --gray-400:  #9ca3af; --gray-500:  #6b7280;
  --gray-600:  #4b5563; --gray-700:  #374151; --gray-800:  #1f2937;
  --white: #ffffff;
  --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-2xl: 1.5rem; --radius-full: 9999px;
  --shadow-card: 0 2px 8px rgb(0 0 0 / 0.08);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.10), 0 4px 6px -4px rgb(0 0 0 / 0.10);
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.10), 0 8px 10px -6px rgb(0 0 0 / 0.10);
}

/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--navy-900);
  /* Subtle pitch pattern overlay */
  background-image:
    radial-gradient(circle at 20% 80%, rgb(22 163 74 / 0.12) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgb(22 163 74 / 0.08) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgb(255 255 255 / 0.02) 0%, transparent 70%);
}

/* ── Pitch lines decoration ─────────────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 79px,
      rgb(255 255 255 / 0.025) 79px,
      rgb(255 255 255 / 0.025) 80px
    );
  pointer-events: none;
  z-index: 0;
}

/* ── Layout ─────────────────────────────────────────────── */
.page {
  position: relative; z-index: 1;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}

/* ── Brand strip (top) ──────────────────────────────────── */
.brand-strip {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  margin-bottom: 2.5rem;
}
.brand-strip__logo {
  font-size: 2rem;
  filter: drop-shadow(0 2px 8px rgb(0 0 0 / 0.40));
}
.brand-strip__name {
  font-size: 1.375rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--white);
}
.brand-strip__name span {
  color: var(--green-500);
}

/* ── Card ───────────────────────────────────────────────── */
.card {
  width: 100%;
  max-width: 420px;
  background: var(--white);
  border-radius: var(--radius-2xl);
  box-shadow: var(--shadow-xl);
  overflow: hidden;
}

/* Card header — green accent band */
.card__head {
  background: linear-gradient(135deg, var(--green-600) 0%, var(--green-700) 100%);
  padding: 2rem 2.5rem 1.75rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.card__head::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 28px;
  background: var(--white);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}
.card__head-ball {
  font-size: 3.25rem;
  display: block;
  margin-bottom: 0.625rem;
  filter: drop-shadow(0 4px 12px rgb(0 0 0 / 0.25));
  position: relative; z-index: 1;
}
.card__head-title {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--white);
  letter-spacing: -0.02em;
  position: relative; z-index: 1;
}
.card__head-sub {
  font-size: 0.875rem;
  color: rgb(255 255 255 / 0.80);
  margin-top: 0.375rem;
  position: relative; z-index: 1;
}

/* Card body */
.card__body {
  padding: 1.75rem 2.5rem 2rem;
}

/* ── Form ───────────────────────────────────────────────── */
.form-group { margin-bottom: 1.25rem; }
.form-label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--gray-700);
  margin-bottom: 0.5rem;
  letter-spacing: 0.01em;
}
.form-input-wrap {
  position: relative;
}
.form-input-icon {
  position: absolute;
  left: 0.875rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
  pointer-events: none;
  opacity: 0.55;
}
.form-input {
  width: 100%;
  font-family: var(--font);
  font-size: 0.9375rem;
  color: var(--gray-900, #111827);
  background: var(--gray-50);
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-lg);
  padding: 0.6875rem 1rem 0.6875rem 2.75rem;
  height: 46px;
  transition: border-color 150ms, box-shadow 150ms, background 150ms;
  outline: none;
}
.form-input::placeholder { color: var(--gray-400); }
.form-input:hover  { border-color: var(--gray-300); background: var(--white); }
.form-input:focus  {
  border-color: var(--green-600);
  background: var(--white);
  box-shadow: 0 0 0 3px rgb(22 163 74 / 0.12);
}

/* ── Divider ─────────────────────────────────────────────── */
.divider {
  display: flex; align-items: center; gap: 0.75rem;
  margin: 1.5rem 0 1.25rem;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--gray-200);
}
.divider span { font-size: 0.75rem; color: var(--gray-400); white-space: nowrap; }

/* ── CTA Button ─────────────────────────────────────────── */
.btn-primary {
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  width: 100%;
  font-family: var(--font);
  font-size: 1rem;
  font-weight: 700;
  color: var(--white);
  background: linear-gradient(135deg, var(--green-600) 0%, var(--green-700) 100%);
  border: none;
  border-radius: var(--radius-lg);
  height: 50px;
  cursor: pointer;
  letter-spacing: 0.01em;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.12), 0 4px 12px rgb(22 163 74 / 0.30);
  transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--green-700) 0%, var(--green-800) 100%);
  box-shadow: 0 2px 6px rgb(0 0 0 / 0.15), 0 6px 20px rgb(22 163 74 / 0.35);
  transform: translateY(-1px);
}
.btn-primary:active { transform: translateY(0); box-shadow: none; }
.btn-primary:focus-visible { outline: 3px solid var(--green-600); outline-offset: 2px; }

/* ── Register link ──────────────────────────────────────── */
.register-row {
  text-align: center;
  margin-top: 1.25rem;
  font-size: 0.875rem;
  color: var(--gray-500);
}
.register-row a {
  color: var(--green-700);
  font-weight: 600;
  text-decoration: none;
  transition: color 150ms;
}
.register-row a:hover { color: var(--green-600); text-decoration: underline; }

/* ── Footer ─────────────────────────────────────────────── */
footer {
  position: relative; z-index: 1;
  padding: 1.5rem;
  text-align: center;
  font-size: 0.75rem;
  color: rgb(255 255 255 / 0.30);
}

/* ── Error alert (Spring Security) ─────────────────────── */
.alert-error {
  display: flex; align-items: flex-start; gap: 0.625rem;
  background: #fef2f2;
  border: 1.5px solid #fca5a5;
  border-radius: var(--radius-lg);
  padding: 0.75rem 1rem;
  margin-bottom: 1.25rem;
  font-size: 0.8125rem;
  color: #b91c1c;
  font-weight: 500;
}
.alert-error__icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }

/* ── Decorative dots (background flavor) ────────────────── */
.bg-dots {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.bg-dots span {
  position: absolute;
  border-radius: 50%;
  background: rgb(255 255 255 / 0.04);
}
</style>
</head>
<body>

<!-- Background dots -->
<div class="bg-dots" aria-hidden="true">
  <span style="width:400px;height:400px;top:-100px;right:-100px;"></span>
  <span style="width:300px;height:300px;bottom:-80px;left:-60px;"></span>
  <span style="width:180px;height:180px;top:40%;right:8%;"></span>
</div>

<main class="page">

  <!-- Brand above card -->
  <div class="brand-strip" aria-label="Quiniela UNA">
    <span class="brand-strip__logo" aria-hidden="true">⚽</span>
    <span class="brand-strip__name">Quiniela <span>UNA</span></span>
  </div>

  <!-- Login card -->
  <div class="card" role="main">

    <!-- Green header -->
    <div class="card__head">
      <span class="card__head-ball" aria-hidden="true">⚽</span>
      <h1 class="card__head-title">¡Bienvenido de vuelta!</h1>
      <p class="card__head-sub">Ingresa y revisa tus predicciones</p>
    </div>

    <!-- Form body -->
    <div class="card__body">

      <!-- Error alert — shown by Spring Security on bad credentials -->
      <!-- (hidden in preview; shown via Thymeleaf th:if="${param.error}") -->
      <div class="alert-error" style="display:none" aria-live="polite">
        <span class="alert-error__icon">⚠️</span>
        Usuario o contraseña incorrectos. Vuelve a intentarlo.
      </div>

      <form method="post" action="/login" novalidate>

        <!-- Username -->
        <div class="form-group">
          <label class="form-label" for="username">Nombre de usuario</label>
          <div class="form-input-wrap">
            <span class="form-input-icon" aria-hidden="true">👤</span>
            <input class="form-input"
                   id="username"
                   name="username"
                   type="text"
                   placeholder="Tu usuario"
                   autocomplete="username"
                   required>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="form-input-wrap">
            <span class="form-input-icon" aria-hidden="true">🔒</span>
            <input class="form-input"
                   id="password"
                   name="password"
                   type="password"
                   placeholder="••••••••"
                   autocomplete="current-password"
                   required>
          </div>
        </div>

        <!-- CSRF hidden (Thymeleaf auto-injects this) -->
        <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"> -->

        <!-- Submit -->
        <button class="btn-primary" type="submit">
          Entrar al torneo →
        </button>

      </form>

      <!-- Register link -->
      <p class="register-row">
        ¿Aún no tienes cuenta?&nbsp;
        <a href="/register">Crear cuenta</a>
      </p>

    </div>
  </div>

</main>

<footer>
  Proyecto EIF211 &mdash; Sistema de Quinielas de Fútbol &mdash; Universidad Nacional de Costa Rica
</footer>

</body>
</html>
