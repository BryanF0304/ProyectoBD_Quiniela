<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Quinielas - Quiniela UNA')}"></head>

<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container mt-4">
    <div th:replace="~{fragments :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Quinielas</h1>
        <a class="btn btn-primary"
           th:if="${session.usuario != null and session.usuario.esAdministrador()}"
           th:href="@{/admin/quinielas/nueva}">Crear quiniela</a>
    </div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(quinielas)}">
        Todavia no hay quinielas registradas.
    </div>

    <div class="row g-3" th:unless="${#lists.isEmpty(quinielas)}">
        <div class="col-md-6" th:each="q : ${quinielas}">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start">
                        <h5 class="card-title" th:text="${q.nombre}">Nombre</h5>
                        <span class="badge"
                              th:classappend="${q.estado == 'abierta'} ? 'bg-success' : (${q.estado == 'finalizada'} ? 'bg-dark' : 'bg-secondary')"
                              th:text="${q.estado}">estado</span>
                    </div>
                    <p class="card-text text-muted" th:text="${q.descripcion}">Descripcion</p>
                    <ul class="list-unstyled small mb-3">
                        <li><strong>Modalidad:</strong> <span th:text="${q.modalidad}">modalidad</span></li>
                        <li><strong>Inscripciones:</strong>
                            <span th:text="${q.fechaInicio}">inicio</span> a
                            <span th:text="${q.fechaCierre}">cierre</span></li>
                        <li><strong>Puntuacion:</strong> <span th:text="${q.tipoPuntuacion}">tipo</span></li>
                    </ul>
                    <a class="btn btn-sm btn-outline-primary mt-auto align-self-start"
                       th:href="@{/quinielas/{id}(id=${q.idQuiniela})}">Ver detalle</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
