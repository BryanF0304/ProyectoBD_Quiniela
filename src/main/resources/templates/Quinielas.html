<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Quinielas - Quiniela UNA')}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<!-- ── Custom styles ─────────────────────────────────────── -->
<style>
body { background: #f3f4f6; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }

/* ── Page header ─────────────────────────────────────────── */
.ql-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.75rem;
}
.ql-header h1 {
    font-size: 1.75rem; font-weight: 800;
    color: #111827; letter-spacing: -0.02em; margin: 0;
}
.ql-header h1 span { color: #16a34a; }

/* ── Create button ───────────────────────────────────────── */
.btn-create {
    display: inline-flex; align-items: center; gap: 0.375rem;
    font-family: inherit; font-size: 0.875rem; font-weight: 700;
    color: #ffffff;
    background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    border: none; border-radius: 0.625rem;
    padding: 0 1.25rem; height: 40px; cursor: pointer;
    box-shadow: 0 1px 3px rgb(0 0 0 / 0.12), 0 3px 10px rgb(22 163 74 / 0.25);
    text-decoration: none;
    transition: all 150ms ease;
}
.btn-create:hover {
    background: linear-gradient(135deg, #15803d 0%, #166534 100%);
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgb(0 0 0 / 0.12), 0 5px 16px rgb(22 163 74 / 0.30);
    color: #ffffff; text-decoration: none;
}

/* ── Alert override ──────────────────────────────────────── */
.ql-success {
    display: flex; align-items: center; gap: 0.625rem;
    background: #f0fdf4; border: 1.5px solid #86efac;
    color: #15803d; border-radius: 0.75rem;
    padding: 0.875rem 1.125rem; margin-bottom: 1.5rem;
    font-size: 0.875rem; font-weight: 500;
}

/* ── Empty state ─────────────────────────────────────────── */
.ql-empty {
    background: #ffffff; border-radius: 1rem;
    border: 2px dashed #e5e7eb;
    padding: 3.5rem 2rem; text-align: center;
    margin-top: 1rem;
}
.ql-empty__icon { font-size: 3rem; display: block; margin-bottom: 0.875rem; }
.ql-empty__title { font-size: 1.125rem; font-weight: 700; color: #374151; margin-bottom: 0.375rem; }
.ql-empty__sub   { font-size: 0.875rem; color: #9ca3af; }

/* ── Card grid ───────────────────────────────────────────── */
.ql-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.25rem;
}

/* ── Quiniela card ───────────────────────────────────────── */
.qcard {
    background: #ffffff;
    border-radius: 0.875rem;
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.07);
    border: 1px solid #f1f5f9;
    border-left: 4px solid #e5e7eb; /* overridden by status */
    display: flex; flex-direction: column;
    transition: box-shadow 250ms ease, transform 250ms ease;
    overflow: hidden;
}
.qcard:hover {
    box-shadow: 0 6px 20px rgb(0 0 0 / 0.10);
    transform: translateY(-2px);
}

/* Status accent — left border + subtle tinted header */
.qcard--abierta    { border-left-color: #16a34a; }
.qcard--cerrada    { border-left-color: #6b7280; }
.qcard--pendiente  { border-left-color: #d97706; }
.qcard--finalizada { border-left-color: #1f2937; }

.qcard__head {
    padding: 1.125rem 1.25rem 0.75rem;
    border-bottom: 1px solid #f3f4f6;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem;
}
.qcard__name {
    font-size: 1rem; font-weight: 700; color: #111827;
    letter-spacing: -0.01em; margin: 0; line-height: 1.3;
}
.qcard__desc {
    font-size: 0.8125rem; color: #6b7280; margin: 0;
    margin-top: 0.2rem; line-height: 1.45;
}

/* ── Status badge ────────────────────────────────────────── */
.status-badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.6875rem; font-weight: 700;
    padding: 0.25rem 0.625rem;
    border-radius: 9999px; border: 1px solid transparent;
    white-space: nowrap; flex-shrink: 0;
    letter-spacing: 0.03em; text-transform: capitalize;
}
.status-badge--abierta    { background: #dcfce7; color: #15803d; border-color: #86efac; }
.status-badge--cerrada    { background: #f3f4f6; color: #4b5563; border-color: #d1d5db; }
.status-badge--pendiente  { background: #fef9c3; color: #a16207; border-color: #fde047; }
.status-badge--finalizada { background: #1f2937; color: #f9fafb; border-color: #374151; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.status-dot--abierta    { background: #16a34a; }
.status-dot--cerrada    { background: #6b7280; }
.status-dot--pendiente  { background: #d97706; }
.status-dot--finalizada { background: #f9fafb; }

/* ── Meta section ────────────────────────────────────────── */
.qcard__meta {
    padding: 0.875rem 1.25rem;
    display: flex; flex-direction: column; gap: 0.5rem;
    flex: 1;
}
.meta-row {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.8125rem;
}
.meta-row__icon { font-size: 0.875rem; opacity: 0.6; flex-shrink: 0; width: 1.125rem; text-align: center; }
.meta-row__label { font-weight: 600; color: #374151; }
.meta-row__value { color: #6b7280; }
.meta-row__dates {
    display: flex; align-items: center; gap: 0.375rem; flex-wrap: wrap;
    color: #6b7280;
}
.date-chip {
    background: #f3f4f6; border-radius: 0.375rem;
    padding: 0.1rem 0.5rem; font-size: 0.75rem; font-weight: 500; color: #374151;
    white-space: nowrap;
}
.date-arrow { color: #9ca3af; font-size: 0.75rem; }

/* ── Card footer ─────────────────────────────────────────── */
.qcard__foot {
    padding: 0.875rem 1.25rem;
    border-top: 1px solid #f3f4f6;
    background: #fafafa;
}
.btn-detail {
    display: inline-flex; align-items: center; gap: 0.375rem;
    font-family: inherit; font-size: 0.8125rem; font-weight: 600;
    color: #15803d;
    background: #f0fdf4; border: 1.5px solid #86efac;
    border-radius: 0.5rem; padding: 0.4375rem 1rem;
    text-decoration: none; cursor: pointer;
    transition: all 150ms ease;
}
.btn-detail:hover {
    background: #dcfce7; border-color: #4ade80; color: #14532d;
    text-decoration: none; transform: translateX(2px);
}
</style>

<!-- ── Page content ───────────────────────────────────────── -->
<div class="container mt-4 mb-5">

    <!-- Success / error alerts -->
    <div th:if="${exito}" class="ql-success" role="status">
        <span aria-hidden="true">✅</span>
        <span th:text="${exito}">Operación exitosa.</span>
    </div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <!-- Page header -->
    <div class="ql-header">
        <h1>Quinielas <span>⚽</span></h1>
        <a class="btn-create"
           th:if="${session.usuario != null and session.usuario.esAdministrador()}"
           th:href="@{/admin/quinielas/nueva}">
            + Crear quiniela
        </a>
    </div>

    <!-- Empty state -->
    <div class="ql-empty" th:if="${#lists.isEmpty(quinielas)}">
        <span class="ql-empty__icon" aria-hidden="true">📋</span>
        <p class="ql-empty__title">No hay quinielas registradas</p>
        <p class="ql-empty__sub">Cuando se cree una quiniela, aparecerá aquí.</p>
    </div>

    <!-- Cards grid -->
    <div class="ql-grid" th:unless="${#lists.isEmpty(quinielas)}">

        <div class="qcard"
             th:each="q : ${quinielas}"
             th:classappend="'qcard--' + ${q.estado}">

            <!-- Card header: name + badge -->
            <div class="qcard__head">
                <div>
                    <h2 class="qcard__name" th:text="${q.nombre}">Nombre de quiniela</h2>
                    <p class="qcard__desc"
                       th:if="${q.descripcion != null and !q.descripcion.isEmpty()}"
                       th:text="${q.descripcion}">Descripción</p>
                </div>
                <span class="status-badge"
                      th:classappend="'status-badge--' + ${q.estado}">
                    <span class="status-dot"
                          th:classappend="'status-dot--' + ${q.estado}"
                          aria-hidden="true"></span>
                    <span th:text="${q.estado}">estado</span>
                </span>
            </div>

            <!-- Meta rows -->
            <div class="qcard__meta">

                <!-- Modalidad -->
                <div class="meta-row">
                    <span class="meta-row__icon" aria-hidden="true">🏟️</span>
                    <span class="meta-row__label">Modalidad</span>
                    <span class="meta-row__value" th:text="${q.modalidad}">—</span>
                </div>

                <!-- Inscripciones — formatted dates -->
                <div class="meta-row">
                    <span class="meta-row__icon" aria-hidden="true">📅</span>
                    <span class="meta-row__label">Inscripciones</span>
                    <div class="meta-row__dates">
                        <span class="date-chip"
                              th:text="${#temporals.format(q.fechaInicio, 'dd/MM/yyyy')}">inicio</span>
                        <span class="date-arrow" aria-label="hasta">→</span>
                        <span class="date-chip"
                              th:text="${#temporals.format(q.fechaCierre, 'dd/MM/yyyy')}">cierre</span>
                    </div>
                </div>

                <!-- Puntuación -->
                <div class="meta-row">
                    <span class="meta-row__icon" aria-hidden="true">🎯</span>
                    <span class="meta-row__label">Puntuación</span>
                    <span class="meta-row__value" th:text="${q.tipoPuntuacion}">—</span>
                </div>

            </div>

            <!-- Card footer: CTA -->
            <div class="qcard__foot">
                <a class="btn-detail"
                   th:href="@{/quinielas/{id}(id=${q.idQuiniela})}">
                    Ver detalle →
                </a>
            </div>

        </div><!-- /.qcard -->

    </div><!-- /.ql-grid -->

</div><!-- /.container -->

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
