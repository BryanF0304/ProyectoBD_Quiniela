<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Registro - Quiniela UNA')}"></head>

<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container mt-4" style="max-width: 520px;">
    <h1 class="h3 mb-3">Crear cuenta</h1>

    <div th:replace="~{fragments :: alerts}"></div>

    <form th:action="@{/registro}" th:object="${registroForm}" method="post">
        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" class="form-control" th:field="*{nombreCompleto}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Correo electronico</label>
            <input type="email" class="form-control" th:field="*{correo}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nombre de usuario</label>
            <input type="text" class="form-control" th:field="*{nombreUsuario}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input type="password" class="form-control" th:field="*{contrasena}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Fecha de nacimiento</label>
            <input type="date" class="form-control" th:field="*{fechaNacimiento}" required>
        </div>
        <button type="submit" class="btn btn-primary">Registrarme</button>
    </form>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
