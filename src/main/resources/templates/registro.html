<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — Quiniela UNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Reset & base ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #0f1f33;
    background-image:
        radial-gradient(circle at 20% 80%, rgb(22 163 74 / 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgb(22 163 74 / 0.08) 0%, transparent 50%);
}
body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
        repeating-linear-gradient(0deg, transparent, transparent 79px,
            rgb(255 255 255 / 0.025) 79px, rgb(255 255 255 / 0.025) 80px);
    pointer-events: none; z-index: 0;
}

/* ── Layout ───────────────────────────────────────────── */
.page {
    position: relative; z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1rem;
}

/* ── Brand ────────────────────────────────────────────── */
.brand-strip {
    display: flex; align-items: center; gap: 0.625rem;
    margin-bottom: 2rem;
}
.brand-strip__logo {
    font-size: 2rem;
    filter: drop-shadow(0 2px 8px rgb(0 0 0 / 0.4));
}
.brand-strip__name {
    font-size: 1.375rem; font-weight: 800;
    letter-spacing: -0.02em; color: #ffffff;
}
.brand-strip__name span { color: #22c55e; }

/* ── Card ─────────────────────────────────────────────── */
.auth-card {
    width: 100%; max-width: 460px;
    background: #ffffff;
    border-radius: 1.5rem;
    box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.10), 0 8px 10px -6px rgb(0 0 0 / 0.10);
    overflow: hidden;
}

/* Header — darker green variant to distinguish from login */
.auth-card__head {
    background: linear-gradient(135deg, #15803d 0%, #14532d 100%);
    padding: 1.75rem 2.5rem 1.625rem;
    text-align: center;
    position: relative; overflow: hidden;
}
.auth-card__head::before {
    /* stadium arc decoration */
    content: '';
    position: absolute;
    width: 280px; height: 280px;
    border: 2px solid rgb(255 255 255 / 0.07);
    border-radius: 50%;
    top: -140px; right: -80px;
    pointer-events: none;
}
.auth-card__head::after {
    content: '';
    position: absolute; bottom: -1px; left: 0; right: 0;
    height: 28px; background: #ffffff;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}
.auth-card__icons {
    display: flex; align-items: center; justify-content: center; gap: 0.375rem;
    margin-bottom: 0.625rem;
    position: relative; z-index: 1;
}
.auth-card__icons span { font-size: 1.75rem; filter: drop-shadow(0 2px 8px rgb(0 0 0 / 0.25)); }
.auth-card__icons span:nth-child(2) { font-size: 2.5rem; }
.auth-card__title {
    font-size: 1.375rem; font-weight: 800; color: #ffffff;
    letter-spacing: -0.02em; position: relative; z-index: 1;
}
.auth-card__sub {
    font-size: 0.8125rem; color: rgb(255 255 255 / 0.75);
    margin-top: 0.3rem; position: relative; z-index: 1;
}
.auth-card__body { padding: 1.625rem 2.5rem 2rem; }

/* ── Two-col row ──────────────────────────────────────── */
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 1rem;
}

/* ── Section divider ──────────────────────────────────── */
.form-section {
    display: flex; align-items: center; gap: 0.625rem;
    margin: 1.125rem 0 1rem;
}
.form-section::before, .form-section::after {
    content: ''; flex: 1; height: 1px; background: #e5e7eb;
}
.form-section span {
    font-size: 0.6875rem; font-weight: 600; color: #9ca3af;
    letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
}

/* ── Form elements ────────────────────────────────────── */
.form-group { margin-bottom: 1.125rem; }
.form-label {
    display: block; font-size: 0.8125rem; font-weight: 600;
    color: #374151; margin-bottom: 0.4rem; letter-spacing: 0.01em;
}
.input-wrap { position: relative; }
.input-icon {
    position: absolute; left: 0.875rem; top: 50%; transform: translateY(-50%);
    font-size: 0.9375rem; pointer-events: none; opacity: 0.5;
}
.form-input {
    width: 100%; font-family: inherit; font-size: 0.9375rem;
    color: #111827; background: #f9fafb;
    border: 1.5px solid #e5e7eb; border-radius: 0.75rem;
    padding: 0.625rem 0.875rem 0.625rem 2.625rem;
    height: 44px; outline: none;
    transition: border-color 150ms, box-shadow 150ms, background 150ms;
}
.form-input::placeholder { color: #9ca3af; }
.form-input:hover  { border-color: #d1d5db; background: #ffffff; }
.form-input:focus  {
    border-color: #16a34a; background: #ffffff;
    box-shadow: 0 0 0 3px rgb(22 163 74 / 0.12);
}
/* date input — shift padding since browser adds native icon on right */
.form-input[type="date"] { padding-right: 0.875rem; }

/* ── Alerts ───────────────────────────────────────────── */
.alert {
    display: flex; align-items: flex-start; gap: 0.625rem;
    border-radius: 0.75rem; padding: 0.75rem 1rem;
    margin-bottom: 1.125rem;
    font-size: 0.8125rem; font-weight: 500;
}
.alert--error   { background: #fef2f2; border: 1.5px solid #fca5a5; color: #b91c1c; }
.alert--success { background: #f0fdf4; border: 1.5px solid #86efac; color: #15803d; }

/* ── Submit button ────────────────────────────────────── */
.btn-register {
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    width: 100%; font-family: inherit;
    font-size: 1rem; font-weight: 700; color: #ffffff;
    background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    border: none; border-radius: 0.75rem; height: 50px;
    cursor: pointer; letter-spacing: 0.01em; margin-top: 0.375rem;
    box-shadow: 0 1px 3px rgb(0 0 0 / 0.12), 0 4px 12px rgb(22 163 74 / 0.30);
    transition: all 150ms ease;
}
.btn-register:hover {
    background: linear-gradient(135deg, #15803d 0%, #166534 100%);
    box-shadow: 0 2px 6px rgb(0 0 0 / 0.15), 0 6px 20px rgb(22 163 74 / 0.35);
    transform: translateY(-1px);
}
.btn-register:active  { transform: translateY(0); box-shadow: none; }
.btn-register:focus-visible { outline: 3px solid #16a34a; outline-offset: 2px; }

/* ── Login link ───────────────────────────────────────── */
.login-row {
    text-align: center; margin-top: 1.125rem;
    font-size: 0.875rem; color: #6b7280;
}
.login-row a {
    color: #15803d; font-weight: 600; text-decoration: none;
    transition: color 150ms;
}
.login-row a:hover { color: #16a34a; text-decoration: underline; }

/* ── Page footer ──────────────────────────────────────── */
.page-footer {
    position: relative; z-index: 1;
    padding: 1.5rem; text-align: center;
    font-size: 0.75rem; color: rgb(255 255 255 / 0.30);
}

/* ── Responsive: stack two-col on narrow screens ──────── */
@media (max-width: 480px) {
    .auth-card { border-radius: 1.25rem; }
    .auth-card__body { padding: 1.5rem 1.5rem 1.75rem; }
    .form-row { grid-template-columns: 1fr; gap: 0; }
}
</style>
</head>

<body>
<main class="page">

    <!-- Brand strip -->
    <div class="brand-strip" aria-label="Quiniela UNA">
        <span class="brand-strip__logo" aria-hidden="true">⚽</span>
        <span class="brand-strip__name">Quiniela <span>UNA</span></span>
    </div>

    <!-- Registration card -->
    <div class="auth-card">

        <!-- Dark-green header -->
        <div class="auth-card__head">
            <div class="auth-card__icons" aria-hidden="true">
                <span>🏆</span>
                <span>⚽</span>
                <span>🎯</span>
            </div>
            <h1 class="auth-card__title">Únete al torneo</h1>
            <p class="auth-card__sub">Crea tu cuenta y empieza a pronosticar</p>
        </div>

        <div class="auth-card__body">

            <!-- Alerts -->
            <div class="alert alert--error" th:if="${error}" role="alert" aria-live="polite">
                <span aria-hidden="true">⚠️</span>
                <span th:text="${error}">Ocurrió un error.</span>
            </div>
            <div class="alert alert--success" th:if="${exito}" role="status" aria-live="polite">
                <span aria-hidden="true">✅</span>
                <span th:text="${exito}">Operación exitosa.</span>
            </div>

            <!-- Registration form -->
            <form th:action="@{/registro}" th:object="${registroForm}" method="post" novalidate>

                <!-- Section: Personal -->
                <div class="form-section"><span>Datos personales</span></div>

                <!-- Full name + Email (two-col) -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="nombreCompleto">Nombre completo</label>
                        <div class="input-wrap">
                            <span class="input-icon" aria-hidden="true">🙋</span>
                            <input class="form-input"
                                   id="nombreCompleto"
                                   type="text"
                                   th:field="*{nombreCompleto}"
                                   placeholder="Tu nombre"
                                   autocomplete="name"
                                   required
                                   autofocus>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="correo">Correo electrónico</label>
                        <div class="input-wrap">
                            <span class="input-icon" aria-hidden="true">✉️</span>
                            <input class="form-input"
                                   id="correo"
                                   type="email"
                                   th:field="*{correo}"
                                   placeholder="usuario@una.cr"
                                   autocomplete="email"
                                   required>
                        </div>
                    </div>
                </div>

                <!-- Birth date (full-width) -->
                <div class="form-group">
                    <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">📅</span>
                        <input class="form-input"
                               id="fechaNacimiento"
                               type="date"
                               th:field="*{fechaNacimiento}"
                               required>
                    </div>
                </div>

                <!-- Section: Account -->
                <div class="form-section"><span>Credenciales de acceso</span></div>

                <!-- Username + Password (two-col) -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="nombreUsuario">Usuario</label>
                        <div class="input-wrap">
                            <span class="input-icon" aria-hidden="true">👤</span>
                            <input class="form-input"
                                   id="nombreUsuario"
                                   type="text"
                                   th:field="*{nombreUsuario}"
                                   placeholder="Tu usuario"
                                   autocomplete="username"
                                   required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="contrasena">Contraseña</label>
                        <div class="input-wrap">
                            <span class="input-icon" aria-hidden="true">🔒</span>
                            <input class="form-input"
                                   id="contrasena"
                                   type="password"
                                   th:field="*{contrasena}"
                                   placeholder="••••••••"
                                   autocomplete="new-password"
                                   required>
                        </div>
                    </div>
                </div>

                <button class="btn-register" type="submit">
                    Crear mi cuenta →
                </button>

            </form>

            <!-- Login link -->
            <p class="login-row">
                ¿Ya tienes cuenta?&nbsp;
                <a th:href="@{/login}">Iniciar sesión</a>
            </p>

        </div><!-- /.auth-card__body -->
    </div><!-- /.auth-card -->

</main>

<footer class="page-footer">
    Proyecto EIF211 &mdash; Sistema de Quinielas de Fútbol &mdash; Universidad Nacional de Costa Rica
</footer>

</body>
</html>
