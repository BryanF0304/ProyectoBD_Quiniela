<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Nueva quiniela - Quiniela UNA')}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<style>
body { background: #f3f4f6; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }

/* ── Page wrapper ────────────────────────────────────────── */
.qf-page {
    max-width: 680px; margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
}

/* ── Page header ─────────────────────────────────────────── */
.qf-header {
    display: flex; align-items: center; gap: 0.875rem;
    margin-bottom: 2rem;
}
.qf-header__icon {
    width: 44px; height: 44px; border-radius: 0.75rem;
    background: linear-gradient(135deg, #16a34a, #15803d);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.375rem; flex-shrink: 0;
    box-shadow: 0 2px 8px rgb(22 163 74 / 0.30);
}
.qf-header__text h1 {
    font-size: 1.5rem; font-weight: 800; color: #111827;
    letter-spacing: -0.02em; margin: 0;
}
.qf-header__text p {
    font-size: 0.8125rem; color: #6b7280; margin: 0.2rem 0 0;
}

/* ── Alert ───────────────────────────────────────────────── */
.qf-alert {
    display: flex; align-items: flex-start; gap: 0.625rem;
    border-radius: 0.75rem; padding: 0.875rem 1.125rem;
    margin-bottom: 1.5rem; font-size: 0.875rem; font-weight: 500;
}
.qf-alert--error   { background: #fef2f2; border: 1.5px solid #fca5a5; color: #b91c1c; }
.qf-alert--success { background: #f0fdf4; border: 1.5px solid #86efac; color: #15803d; }

/* ── Form card ───────────────────────────────────────────── */
.form-card {
    background: #ffffff; border-radius: 1rem;
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.07);
    border: 1px solid #f1f5f9;
    overflow: hidden;
}

/* Section divider inside the card */
.form-section {
    padding: 1rem 1.5rem 0.75rem;
    border-bottom: 1px solid #f3f4f6;
    background: #fafafa;
}
.form-section__label {
    font-size: 0.6875rem; font-weight: 700; color: #9ca3af;
    text-transform: uppercase; letter-spacing: 0.07em;
    display: flex; align-items: center; gap: 0.4rem;
}

.form-body { padding: 1.25rem 1.5rem; }

/* ── Form controls ───────────────────────────────────────── */
.form-group { margin-bottom: 1.125rem; }
.form-group:last-child { margin-bottom: 0; }
.form-label {
    display: block; font-size: 0.8125rem; font-weight: 600;
    color: #374151; margin-bottom: 0.4rem;
}
.form-hint { font-size: 0.75rem; color: #9ca3af; margin-top: 0.25rem; }

.form-input,
.form-textarea,
.form-select {
    width: 100%; font-family: inherit; font-size: 0.9375rem;
    color: #111827; background: #f9fafb;
    border: 1.5px solid #e5e7eb; border-radius: 0.625rem;
    padding: 0.625rem 0.875rem;
    outline: none;
    transition: border-color 150ms, box-shadow 150ms, background 150ms;
}
.form-input       { height: 44px; }
.form-select      { height: 44px; cursor: pointer; }
.form-textarea    { resize: vertical; min-height: 80px; line-height: 1.55; }

.form-input::placeholder,
.form-textarea::placeholder { color: #9ca3af; }
.form-input:hover, .form-textarea:hover, .form-select:hover  { border-color: #d1d5db; background: #ffffff; }
.form-input:focus, .form-textarea:focus, .form-select:focus  {
    border-color: #16a34a; background: #ffffff;
    box-shadow: 0 0 0 3px rgb(22 163 74 / 0.12);
}

/* ── Two-col date row ────────────────────────────────────── */
.date-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
}
.date-row__arrow {
    display: none; /* shown on larger screens only */
}

/* ── Modalidad pills ─────────────────────────────────────── */
.modalidad-group { display: flex; gap: 0.75rem; }
.modalidad-option { position: relative; flex: 1; }
.modalidad-option input[type="radio"] {
    position: absolute; opacity: 0; width: 0; height: 0;
}
.modalidad-option label {
    display: flex; flex-direction: column; align-items: center; gap: 0.375rem;
    padding: 0.875rem 1rem;
    background: #f9fafb; border: 1.5px solid #e5e7eb;
    border-radius: 0.75rem; cursor: pointer;
    transition: all 150ms ease; text-align: center;
}
.modalidad-option label .icon { font-size: 1.5rem; }
.modalidad-option label .name { font-size: 0.8125rem; font-weight: 700; color: #374151; }
.modalidad-option label .desc { font-size: 0.6875rem; color: #9ca3af; }
.modalidad-option input:checked + label {
    background: #f0fdf4; border-color: #16a34a;
    box-shadow: 0 0 0 3px rgb(22 163 74 / 0.10);
}
.modalidad-option input:checked + label .name { color: #15803d; }
.modalidad-option label:hover { background: #f3f4f6; border-color: #d1d5db; }

/* ── Puntuacion select — shown in same section ───────────── */

/* ── Footer actions ──────────────────────────────────────── */
.form-footer {
    padding: 1.125rem 1.5rem;
    border-top: 1px solid #f3f4f6;
    background: #fafafa;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.btn-create {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: inherit; font-size: 0.9375rem; font-weight: 700;
    color: #ffffff; background: linear-gradient(135deg, #16a34a, #15803d);
    border: none; border-radius: 0.625rem; height: 46px;
    padding: 0 1.75rem; cursor: pointer;
    box-shadow: 0 2px 10px rgb(22 163 74 / 0.28);
    transition: all 150ms ease;
}
.btn-create:hover {
    background: linear-gradient(135deg, #15803d, #166534);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgb(22 163 74 / 0.34);
}
.btn-create:active { transform: translateY(0); box-shadow: none; }
.btn-create:focus-visible { outline: 3px solid #16a34a; outline-offset: 2px; }

.btn-cancel {
    display: inline-flex; align-items: center; gap: 0.375rem;
    font-family: inherit; font-size: 0.875rem; font-weight: 600;
    color: #6b7280; background: transparent;
    border: 1.5px solid #e5e7eb; border-radius: 0.625rem; height: 46px;
    padding: 0 1.25rem; text-decoration: none; cursor: pointer;
    transition: all 150ms ease;
}
.btn-cancel:hover { background: #f3f4f6; border-color: #d1d5db; color: #374151; text-decoration: none; }
</style>

<div class="qf-page">

    <!-- Page header -->
    <div class="qf-header">
        <div class="qf-header__icon" aria-hidden="true">🏆</div>
        <div class="qf-header__text">
            <h1>Nueva quiniela</h1>
            <p>Configura los detalles de la competencia</p>
        </div>
    </div>

    <!-- Alerts -->
    <div class="qf-alert qf-alert--error" th:if="${error}" role="alert">
        <span aria-hidden="true">⚠️</span>
        <span th:text="${error}">Error.</span>
    </div>
    <div class="qf-alert qf-alert--success" th:if="${exito}" role="status">
        <span aria-hidden="true">✅</span>
        <span th:text="${exito}">Éxito.</span>
    </div>

    <!-- Form card -->
    <div class="form-card">
        <form th:action="@{/admin/quinielas}" th:object="${quinielaForm}" method="post" novalidate>

            <!-- ── Section: Identificación ──────────────── -->
            <div class="form-section">
                <span class="form-section__label">📋 Identificación</span>
            </div>
            <div class="form-body">
                <div class="form-group">
                    <label class="form-label" for="nombre">Nombre de la quiniela</label>
                    <input class="form-input" id="nombre" type="text"
                           th:field="*{nombre}"
                           placeholder="Ej: Quiniela Apertura 2025"
                           autofocus required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="descripcion">Descripción</label>
                    <textarea class="form-textarea" id="descripcion" rows="2"
                              th:field="*{descripcion}"
                              placeholder="Breve descripción de la quiniela…"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reglas">Reglas</label>
                    <textarea class="form-textarea" id="reglas" rows="3"
                              th:field="*{reglas}"
                              placeholder="Describe las reglas de participación…"></textarea>
                    <p class="form-hint">Los participantes deberán aceptar estas reglas al inscribirse.</p>
                </div>
            </div>

            <!-- ── Section: Inscripciones ────────────────── -->
            <div class="form-section">
                <span class="form-section__label">📅 Período de inscripciones</span>
            </div>
            <div class="form-body">
                <div class="date-row">
                    <div class="form-group">
                        <label class="form-label" for="fechaInicio">Inicio</label>
                        <input class="form-input" id="fechaInicio" type="date"
                               th:field="*{fechaInicio}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="fechaCierre">Cierre</label>
                        <input class="form-input" id="fechaCierre" type="date"
                               th:field="*{fechaCierre}" required>
                    </div>
                </div>
            </div>

            <!-- ── Section: Configuración ────────────────── -->
            <div class="form-section">
                <span class="form-section__label">⚙️ Configuración</span>
            </div>
            <div class="form-body">
                <!-- Modalidad — visual radio pills -->
                <div class="form-group">
                    <label class="form-label">Modalidad</label>
                    <div class="modalidad-group">
                        <div class="modalidad-option">
                            <input type="radio" id="mod-publica" name="modalidad"
                                   th:field="*{modalidad}" value="publica" required>
                            <label for="mod-publica">
                                <span class="icon" aria-hidden="true">🌐</span>
                                <span class="name">Pública</span>
                                <span class="desc">Cualquiera puede unirse</span>
                            </label>
                        </div>
                        <div class="modalidad-option">
                            <input type="radio" id="mod-privada" name="modalidad"
                                   th:field="*{modalidad}" value="privada">
                            <label for="mod-privada">
                                <span class="icon" aria-hidden="true">🔒</span>
                                <span class="name">Privada</span>
                                <span class="desc">Solo por invitación</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ── Footer actions ────────────────────────── -->
            <div class="form-footer">
                <a class="btn-cancel" th:href="@{/quinielas}">← Cancelar</a>
                <button class="btn-create" type="submit">
                    Crear quiniela →
                </button>
            </div>

        </form>
    </div><!-- /.form-card -->

</div><!-- /.qf-page -->

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
