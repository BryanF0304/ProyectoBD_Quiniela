<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Quiniela UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-una">
    <div class="container">
        <a class="navbar-brand navbar-brand-custom" th:href="@{/}">&#9917; Quiniela UNA</a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link nav-link-custom" th:href="@{/}">Inicio</a>

            <th:block th:if="${session.usuario == null}">
                <a class="nav-link nav-link-custom" th:href="@{/registro}">Registrarse</a>
                <a class="nav-link nav-link-custom" th:href="@{/login}">Iniciar sesion</a>
            </th:block>

            <th:block th:if="${session.usuario != null}">
                <a class="nav-link nav-link-custom" th:href="@{/quinielas}">Quinielas</a>
                <a class="nav-link nav-link-custom" th:if="${session.usuario.esAdministrador()}"
                   th:href="@{/admin}">Admin</a>
                <div style="border-left: 2px solid #16a34a; padding-left: 12px;">
                    <i class="bi bi-person-circle me-1"></i>
                    <span class="navbar-text text-light me-3"
                          th:text="'Hola, ' + ${session.usuario.nombreUsuario}">Hola</span>
                </div>
                <a class="nav-link nav-link-custom text-danger" th:href="@{/logout}">Salir</a>
            </th:block>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div class="alert alert-success d-flex align-items-center gap-2" th:if="${exito}">
        <i class="bi bi-check-circle-fill flex-shrink-0"></i>
        <span th:text="${exito}"></span>
    </div>
    <div class="alert alert-danger d-flex align-items-center gap-2" th:if="${error}">
        <i class="bi bi-x-circle-fill flex-shrink-0"></i>
        <span th:text="${error}"></span>
    </div>
    <div class="alert alert-danger d-flex align-items-center gap-2" th:if="${param.error}">
        <i class="bi bi-x-circle-fill flex-shrink-0"></i>
        <span th:text="${param.error}"></span>
    </div>
</div>

<footer th:fragment="footer" class="text-center text-muted py-4 mt-5 border-top pt-3 quiniela-footer">
    <small>Proyecto EIF211 &mdash; Sistema de Quinielas de Futbol</small>
</footer>

</body>
</html>
