<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Quiniela UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">&#9917; Quiniela UNA</a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link" th:href="@{/}">Inicio</a>

            <th:block th:if="${session.usuario == null}">
                <a class="nav-link" th:href="@{/registro}">Registrarse</a>
                <a class="nav-link" th:href="@{/login}">Iniciar sesion</a>
            </th:block>

            <th:block th:if="${session.usuario != null}">
                <a class="nav-link" th:href="@{/quinielas}">Quinielas</a>
                <a class="nav-link" th:if="${session.usuario.esAdministrador()}"
                   th:href="@{/admin}">Admin</a>
                <span class="navbar-text text-light me-3"
                      th:text="'Hola, ' + ${session.usuario.nombreUsuario}">Hola</span>
                <a class="nav-link" th:href="@{/logout}">Salir</a>
            </th:block>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-danger" th:if="${param.error}" th:text="${param.error}"></div>
</div>

<footer th:fragment="footer" class="text-center text-muted py-4 mt-5 border-top">
    <small>Proyecto EIF211 &mdash; Sistema de Quinielas de Futbol</small>
</footer>

</body>
</html>
